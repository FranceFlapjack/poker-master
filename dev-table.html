<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Table — dev page</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
<style>
  /* not part of the app — this page exists so table.js can be LOOKED at, not just read */
  body { padding: var(--s-6); }
  .dev { max-width: var(--board-max); }
  .dev h2 { margin-top: var(--s-7); }
  .dev .note { font-size: var(--fs-1); color: var(--ink-2); margin: 0 0 var(--s-3); }
  .dev .check { font-family: var(--font-mono); font-size: 12px; color: var(--ink-2); margin-bottom: var(--s-2); }
  .dev .check.bad { color: var(--bad); font-weight: 700; }
</style>
</head>
<body>
<div class="dev">
  <h1>Table — dev page</h1>
  <p class="note">Phase 1 check for <code>js/table.js</code>. Not linked from the app and not part of the
  course; it exists so the table can be seen at every shape it has to handle. Delete it, or fold it into a
  lesson, once real pages use the component.</p>
  <div id="out"></div>
</div>
<script type="module">
import { parseCards, cardsStr } from './js/engine/cards.js'
import { createHand, applyAction, legalActions, potTotal } from './js/engine/rules.js'
import { mountTable, describeTable } from './js/table.js'
import { avatarsForSeats } from './js/avatars.js'

const out = document.getElementById('out')
const H = s => parseCards(s)
const stacks = (n, size, names = []) => Array.from({ length: n }, (_, i) => ({ stack: size, name: names[i] || `Seat ${i + 1}` }))
const act = (s, type, amount) => applyAction(s, amount == null ? { type } : { type, amount })

function show(title, note, state, opts = {}) {
  const h = document.createElement('h2'); h.textContent = title; out.append(h)
  const p = document.createElement('p'); p.className = 'note'; p.textContent = note; out.append(p)
  const c = document.createElement('div'); c.className = 'check'; c.textContent = describeTable(state, opts); out.append(c)
  const handle = mountTable(out, { state, ...opts })
  return { handle, describe: s => { c.textContent = describeTable(s, opts) } }
}

// 1 — nine-handed, the widest seating the app must lay out
let nine = createHand({
  seats: stacks(9, 25000, ['Hero', 'Ana', 'Bo', 'Cy', 'Dee', 'Eli', 'Fay', 'Gus', 'Hal']),
  button: 6, blinds: { sb: 100, bb: 200, ante: 25 }, anteType: 'each', seed: 11,
})
show('Nine-handed, antes posted', 'Hero sits at the bottom; the rest run clockwise. Check the button, the blind tags, and that nothing collides.', nine, { hero: 0, interactive: true, onAction: () => {} })

// 2 — three-way all-in with side pots, shown down
let sp = createHand({
  seats: [{ stack: 300, name: 'Short' }, { stack: 1000, name: 'Mid' }, { stack: 2000, name: 'Deep' }],
  button: 0, blinds: { sb: 50, bb: 100 },
  hole: { 0: H('As Ks'), 1: H('Qh Qd'), 2: H('7c 7s') }, board: H('2c 7d 9h Ts 3h'),
})
sp = act(sp, 'raise', 300); sp = act(sp, 'raise', 1000); sp = act(sp, 'call')
show('Three-way all-in, side pots, shown down', 'Deep makes a set of sevens and wins both pots. Stacks must total 3,300 and the pot must read as paid.', sp, { hero: null, reveal: true })
{
  const total = sp.seats.reduce((n, p) => n + p.stack, 0) + potTotal(sp)
  const c = document.createElement('div')
  c.className = 'check' + (total === 3300 ? '' : ' bad')
  c.textContent = `chips in play ${total} (expected 3300) · winners ${sp.result.winners.join(', ')} · pots ${sp.result.pots.map(p => p.amount).join(' + ')}`
  out.append(c)
}

// 3 — heads-up, deep, facing a bet on the turn
let hu = createHand({
  seats: [{ stack: 12000, name: 'Hero' }, { stack: 9400, name: 'Villain' }],
  button: 0, blinds: { sb: 100, bb: 200 },
  hole: { 0: H('Ah Qh'), 1: H('Kc Jd') }, board: H('Qs 8h 3c 7h 2d'), seed: 4,
})
hu = act(hu, 'raise', 500); hu = act(hu, 'call')       // preflop
hu = act(hu, 'check'); hu = act(hu, 'bet', 600)        // flop: Villain checks first (big blind), Hero bets
// This one is live: acting updates the same mounted component in place, which is how the lesson and
// play pages will drive it. Reloading the page instead would prove nothing about update().
const huView = show('Heads-up, playable', 'Villain is to act facing 600, so the controls belong to the seat at the top. Play it out — the component updates in place, and the hand ends at showdown.', hu, {
  hero: 0, interactive: true,
  onAction: a => {
    hu = act(hu, a.type, a.amount)
    huView.handle.update({ state: hu, interactive: hu.street !== 'complete', reveal: hu.street === 'complete' })
    huView.describe(hu)
  },
})

// 4 — folded and all-in states side by side
let mixed = createHand({
  seats: stacks(6, 8000, ['Hero', 'Ana', 'Bo', 'Cy', 'Dee', 'Eli']),
  button: 0, blinds: { sb: 100, bb: 200 }, seed: 3,
})
mixed = act(mixed, 'fold'); mixed = act(mixed, 'fold'); mixed = act(mixed, 'raise', 8000)
show('Folded seats dimmed, one player all in', 'Two folded seats must dim; the all-in seat must read ALL IN rather than a stack of zero.', mixed, { hero: 0 })

// 5 — the real portrait set, nine handed
const TABLE = [
  { name: 'Hero', stack: 25000 }, { name: 'Ana', stack: 7900 }, { name: 'Bo', stack: 3100 },
  { name: 'Cy', stack: 48000 }, { name: 'Dee', stack: 12400 }, { name: 'Eli', stack: 1800 },
  { name: 'Fay', stack: 31000 }, { name: 'Gus', stack: 5600 }, { name: 'Hal', stack: 16500 },
]
let portraits = createHand({
  seats: TABLE,
  button: 6, blinds: { sb: 100, bb: 200, ante: 25 }, anteType: 'each', seed: 8,
})
show('Seat portraits — the real set', 'Nine portraits by shigureni (shigureni.com), used under their terms. Check they stay tellable apart at this size: that is the whole job of a seat portrait.', portraits, {
  hero: 0, avatars: avatarsForSeats(9),
})

// 6 — mixed: some seats with art, some without, so the fallback path stays exercised
let mixedArt = createHand({
  seats: stacks(6, 8000, ['Hero', 'Ana', 'Bo', 'Cy', 'Dee', 'Eli']),
  button: 0, blinds: { sb: 100, bb: 200 }, seed: 8,
})
show('Missing art falls back', 'Seats 2 and 4 have no portrait and get the built-in figure. A table must never depend on an image file existing.', mixedArt, {
  hero: 0, avatars: avatarsForSeats(6, { skip: [2, 4] }),
})

console.log('dev-table: rendered', out.querySelectorAll('svg.pk-table').length, 'tables')
</script>
</body>
</html>
